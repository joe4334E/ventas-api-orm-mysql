<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo de productos</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/productos.js"></script>
  </head>
  <body>
    <main>
      <h1>Catálogo de productos</h1>
      <p id="estado" class="estado">Cargando…</p>
      <table id="tabla-productos" hidden>
        <thead>
          <tr>
            <th scope="col" class="col-id">Id</th>
            <th scope="col">Producto</th>
            <th scope="col" class="col-precio">Precio</th>
            <th scope="col" class="col-stock">Stock</th>
            <th scope="col" class="col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="filas"></tbody>
        <tfoot>
          <tr>
            <th scope="row" colspan="2">Total del catálogo</th>
            <td id="total-valor" class="col-precio"></td>
            <td id="total-unidades" class="col-stock"></td>
            <td></td>
          </tr>
        </tfoot>
      </table>
      <form id="formulario" class="formulario">
        <h2 id="titulo-formulario">Añadir producto</h2>
        <div class="campos">
          <label>
            Nombre
            <input id="campo-nombre" name="nombre" type="text" required />
          </label>
          <label>
            Precio
            <input id="campo-precio" name="precio" type="number" step="0.01" min="0" required />
          </label>
          <label>
            Stock
            <input id="campo-stock" name="stock" type="number" step="1" min="0" required />
          </label>
        </div>
        <div class="acciones">
          <button type="submit" id="boton-enviar">Añadir</button>
          <button type="button" id="boton-cancelar" hidden>Cancelar</button>
        </div>
      </form>
    </main>
  </body>
</html>
